[project]
name = "kuma-voice-backend"
version = "0.1.0"
description = "Local FastAPI prototype backend for Kuma Voice."
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.20,<1",
    "asyncpg>=0.30,<1",
    "cryptography>=45,<47",
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "pwdlib[argon2]>=0.2,<1",
    "pydantic-settings>=2.10,<3",
    "python-multipart>=0.0.20,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "uvicorn[standard]>=0.35,<1",
    "websockets>=17,<18",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
