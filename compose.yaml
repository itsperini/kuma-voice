name: kuma-voice

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kuma}
      POSTGRES_USER: ${POSTGRES_USER:-kuma}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kuma-local}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kuma} -d ${POSTGRES_DB:-kuma}"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - kuma_postgres:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-kuma}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-kuma-minio-local}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - kuma_minio:/data

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      KUMA_ENVIRONMENT: local
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-kuma}:${POSTGRES_PASSWORD:-kuma-local}@postgres:5432/${POSTGRES_DB:-kuma}
      KUMA_ENCRYPTION_KEY_FILE: /var/lib/kuma/encryption.key
      KUMA_REQUIRE_DEVICE_AUTH: "true"
      KUMA_STUDIO_URL: http://localhost:3001/studio
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8080"
    volumes:
      - kuma_secrets:/var/lib/kuma

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    environment:
      KUMA_API_INTERNAL_URL: http://api:8080
    depends_on:
      - api
    ports:
      - "3001:3000"

volumes:
  kuma_postgres:
  kuma_minio:
  kuma_secrets:
